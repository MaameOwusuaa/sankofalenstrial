<!doctype html>
    <html lang="en">
        <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Register | SankofaLens</title>
            <link rel="stylesheet" href="../static/css/variables.css">
            <link rel="stylesheet" href="../static/css/base.css">
            <link rel="stylesheet" href="../static/css/navbar.css">
            <link rel="stylesheet" href="../static/css/hero.css">
            <link rel="stylesheet" href="../static/css/heritage.css">
            <link rel="stylesheet" href="../static/css/map.css">
            <link rel="stylesheet" href="../static/css/guide.css">
            <link rel="stylesheet" href="../static/css/passport.css">
            <link rel="stylesheet" href="../static/css/auth.css">
            <link rel="stylesheet" href="../static/css/admin.css">
            <link rel="stylesheet" href="../static/css/footer.css">
            <link rel="stylesheet" href="../static/css/responsive.css">
        </head>
        <body class="auth-page">
            <header class="site-header">
                <a class="brand" href="/">
                    <img src="https://summit.thehacsa.org/logo.png" alt="HACSA Foundation logo">
                    <span>
                        <b>SANKOFALENS</b>
                        <small>See the past. Understand the story. Experience the culture.</small>
                    </span>
                </a>
                <nav>
                    <a href="../index.html">Home</a>
                </nav>  
            </header>  
            <main class="auth-card">
                <img src="https://summit.thehacsa.org/logo.png" alt="HACSA logo">
                <span class="eyebrow">CULTURAL PASSPORT</span>
                <h1>Create your account</h1>
                <form id="registerForm">
                    <input id="first_name" placeholder="First name" required>
                    <input id="last_name" placeholder="Last name" required>
                    <input id="email" type="email" placeholder="Email" required>
                    <input id="password" type="password" placeholder="Password (8+ characters)" required>
                    <button class="btn primary">Create account</button>
                </form>
                <p id="msg">
                </p>
                <a href="login.html">Already have an account?</a>
            </main>
            <script type="module" src="../static/js/auth.js">
            </script>
        </body>
    </html>
